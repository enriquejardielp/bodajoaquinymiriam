<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/favicon.ico">
</head>
<body>
  <div id="photo-container"></div>
  
  <div class="content">
    <div class="announcement">
      <h1 id="main-title">Cargando...</h1>
      <p class="invitation-text" id="invitation-text"></p>
    </div>
    
    <div class="countdown">
      <div id="countdown-timer">
        <div><span id="days">00</span>Días</div>
        <div><span id="hours">00</span>Horas</div>
        <div><span id="minutes">00</span>Minutos</div>
        <div><span id="seconds">00</span>Segundos</div>
      </div>
    </div>
    
    <div class="rsvp">
      <a href="#" id="rsvp-link">Confirmar Asistencia</a>
    </div>
  </div>

  <div id="church-section" class="location-section">
    <div class="location-image" id="church-image"></div>
    <div class="location-info">
      <h2 id="church-title"></h2>
      <p class="time-info" id="church-time"></p>
      <div class="map-container" id="church-map"></div>
    </div>
  </div>

  <div id="restaurant-section" class="location-section">
    <div class="location-image" id="restaurant-image"></div>
    <div class="location-info">
      <h2 id="restaurant-title"></h2>
      <p class="time-info" id="restaurant-time"></p>
      <div class="map-container" id="restaurant-map"></div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
